allowBuilds:
  unrs-resolver: true
  prisma: false
  '@prisma/engines': false
  '@nestjs/core': false
  esbuild: false
  '@swc/core': false
  puppeteer: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  msgpackr-extract: false

# nestjs-zod 5.5.0 declares peers up to Nest 11 / @nestjs/swagger 11; it only uses the public decorator and
# pipe APIs, which Nest 12 keeps. The boot test of the docs (src/api/docs) fails if that ever stops being true
peerDependencyRules:
  allowedVersions:
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'

# Jest 30 only require()s the ESM-only packages of Nest 12 when Node runs with
# --experimental-vm-modules; set here once for every pnpm script instead of repeating it per script
nodeOptions: '${NODE_OPTIONS:- } --experimental-vm-modules --disable-warning=ExperimentalWarning'

patchedDependencies:
  whatsapp-web.js@1.34.7: patches/whatsapp-web.js@1.34.7.patch

# Transitive copies with a published fix. The majors are forced on purpose: archiver (glob 10),
# @fastify/static (glob 13) and get-uri (basic-ftp 5) only call APIs that kept their shape, checked
# by running them. Remove each entry once its parents ask for a patched version themselves.
# minimatch gets no override: 11 drops the default export that readdir-glob (archiver) needs and the
# `makeRe` export that eslint-plugin-import-x needs. glob 14 brings its own minimatch 11 privately.
overrides:
  'basic-ftp@<6.2.1': 6.2.1
  'glob@<14.0.2': 14.0.2
