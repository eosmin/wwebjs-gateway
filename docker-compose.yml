# Development stack: `docker compose up` builds the gateway and starts it with its dependencies.
# The ports are published on the loopback only: the stack runs with the default credentials of
# .env.example, so it must not be reachable from the network.
# The published ports can be moved when the default ones are taken, for example
# `API_PORT=3001 POSTGRES_PORT=5433 REDIS_PORT=6380 docker compose up`.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder under this path
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'gateway', '-d', 'gateway']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    # AOF on: the queues must survive a restart
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # The values of .env.example, except where the services are reached by name
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
